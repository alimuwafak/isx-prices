name: Update ISX Stock Prices

on:
  schedule:
    # كل 30 دقيقة، من 06:30 إلى 11:30 UTC (يعني ~10:00 - 15:00 بتوقيت
    # بغداد)، أيام الأحد للخميس فقط - يغطي وقت جلسات التداول تقريباً.
    # عدّل الأوقات إذا احتجت (تنسيق cron بتوقيت UTC).
    - cron: '0,30 6-11 * * 0,1,2,3,4'
  workflow_dispatch: {} # يسمح لك تشغّله يدوياً من تبويب Actions بجيت هب

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python fetch_isx_prices.py --debug

      - name: Upload debug artifacts (for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: debug/
          retention-days: 3

      - name: Commit updated prices.json
        run: |
          git config user.name "isx-price-bot"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --quiet --cached || git commit -m "Update ISX prices [automated]"
          git push
